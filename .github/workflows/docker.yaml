name: Docker Mirror

on:
  workflow_dispatch:
  push:
    branches: [main]

env:
  ALIYUN_REGISTRY: "${{ secrets.ALIYUN_REGISTRY }}"
  ALIYUN_NAME_SPACE: "${{ secrets.ALIYUN_NAME_SPACE }}"
  ALIYUN_REGISTRY_USER: "${{ secrets.ALIYUN_REGISTRY_USER }}"
  ALIYUN_REGISTRY_PASSWORD: "${{ secrets.ALIYUN_REGISTRY_PASSWORD }}"

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Install skopeo
      run: |
        sudo apt-get update
        sudo apt-get install -y skopeo
        skopeo --version

    - name: Login to Aliyun
      run: |
        echo "$ALIYUN_REGISTRY_PASSWORD" | skopeo login \
          -u "$ALIYUN_REGISTRY_USER" \
          --password-stdin \
          "$ALIYUN_REGISTRY"

    - name: Mirror all images
      run: |
        # 第一遍：检测重名镜像
        declare -A duplicate_images
        declare -A temp_map

        while IFS= read -r line || [ -n "$line" ]; do
            [[ -z "$line" ]] && continue
            [[ "$line" =~ ^[[:space:]]*# ]] && continue

            # 取最后一个空格分隔的 token 作为镜像地址
            image=$(echo "$line" | awk '{print $NF}')
            image="${image%%@*}"  # 去掉 @sha256:...

            # 镜像名（含 tag）
            image_name_tag=$(echo "$image" | awk -F'/' '{print $NF}')
            image_name=$(echo "$image_name_tag" | awk -F':' '{print $1}')

            # 命名空间
            name_space=$(echo "$image" | awk -F'/' '{if (NF==3) print $2; else if (NF==2) print $1; else print ""}')
            name_space="${name_space}_"

            if [[ -n "${temp_map[$image_name]}" ]]; then
                if [[ "${temp_map[$image_name]}" != "$name_space" ]]; then
                    echo "Duplicate image name detected: $image_name"
                    duplicate_images[$image_name]="true"
                fi
            else
                temp_map[$image_name]="$name_space"
            fi
        done < images.txt

        # 第二遍：执行同步
        success=0
        failed=0

        while IFS= read -r line || [ -n "$line" ]; do
            [[ -z "$line" ]] && continue
            [[ "$line" =~ ^[[:space:]]*# ]] && continue

            # 取镜像地址
            image=$(echo "$line" | awk '{print $NF}')
            image="${image%%@*}"

            # 镜像名:tag
            image_name_tag=$(echo "$image" | awk -F'/' '{print $NF}')
            image_name=$(echo "$image_name_tag" | awk -F':' '{print $1}')

            # 命名空间
            name_space=$(echo "$image" | awk -F'/' '{if (NF==3) print $2; else if (NF==2) print $1; else print ""}')

            # 处理重名：加命名空间前缀
            name_prefix=""
            if [[ -n "${duplicate_images[$image_name]}" && -n "$name_space" ]]; then
                name_prefix="${name_space}_"
            fi

            dest="$ALIYUN_REGISTRY/$ALIYUN_NAME_SPACE/${name_prefix}${image_name_tag}"

            echo ""
            echo "========================================"
            echo "Source:  $image"
            echo "Target:  $dest"
            echo "Mode:    --all (all architectures)"
            echo "========================================"

            if skopeo copy --all "docker://$image" "docker://$dest"; then
                echo "✅ Success: $image_name_tag"
                success=$((success + 1))
            else
                echo "❌ Failed: $image_name_tag"
                failed=$((failed + 1))
            fi
        done < images.txt

        echo ""
        echo "========================================"
        echo "Mirror complete: $success succeeded, $failed failed"
        echo "========================================"

        # 如果有失败则退出码非零
        [[ $failed -eq 0 ]]
